networks:
  olake-network:
    name: olake-network
    driver: bridge

services:
  postgres-source:
    image: postgres:16-alpine
    container_name: postgres-source
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5433:5432"
    volumes:
      - ./init-source.sql:/docker-entrypoint-initdb.d/init-source.sql:ro
    networks:
      - olake-network

  s3proxy:
    image: andrewgaul/s3proxy:latest
    container_name: s3proxy
    environment:
      S3PROXY_AUTHORIZATION: aws-v2-or-v4
      S3PROXY_IDENTITY: admin
      S3PROXY_CREDENTIAL: password123
      S3PROXY_ENDPOINT: http://0.0.0.0:9000
    ports:
      - "9000:9000"
    networks:
      - olake-network

  s3proxy-init:
    image: curlimages/curl:latest
    container_name: s3proxy-init
    depends_on:
      - s3proxy
    networks:
      - olake-network
    command: >
      sh -c "until curl -s http://s3proxy:9000/ > /dev/null; do sleep 1; done;
             curl -s -X PUT http://s3proxy:9000/warehouse/ || true"

  iceberg-rest-catalog:
    image: tabulario/iceberg-rest:latest
    container_name: iceberg-rest-catalog
    ports:
      - "8181:8181"
    environment:
      - AWS_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
      - CATALOG_WAREHOUSE=s3://warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://s3proxy:9000
      - CATALOG_S3_PATH__STYLE__ACCESS=true
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password123
    depends_on:
      - s3proxy
      - s3proxy-init
    networks:
      - olake-network
