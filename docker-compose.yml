version: '3.8'

services:
  postgres-source:
    image: postgres:16
    container_name: postgres-source
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5433:5432"
    volumes:
      - ./init-source.sql:/docker-entrypoint-initdb.d/init-source.sql
    networks:
      - olake-network

  s3proxy:
    image: andrewgaul/s3proxy:latest
    container_name: s3proxy
    environment:
      S3PROXY_IDENTITY: admin
      S3PROXY_CREDENTIAL: password123
      S3PROXY_CORS_ALLOW_ALL: "true"
      S3PROXY_ENDPOINT: http://0.0.0.0:9000
    ports:
      - "9000:9000"
    networks:
      - olake-network

  iceberg-rest-catalog:
    image: tabulario/iceberg-rest:latest
    container_name: iceberg-rest-catalog
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://s3proxy:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_S3_ACCESS__KEY__ID: admin
      CATALOG_S3_SECRET__ACCESS__KEY: password123
    ports:
      - "8181:8181"
    depends_on:
      - s3proxy
    networks:
      - olake-network

networks:
  olake-network:
    driver: bridge
    name: olake-network
