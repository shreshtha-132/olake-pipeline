version: '3.8'

networks:
  olake-network:
    name: olake-network
    driver: bridge

services:
  postgres-source:
    image: postgres:16-alpine
    container_name: postgres-source
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5433:5432"
    volumes:
      - ./init-source.sql:/docker-entrypoint-initdb.d/init-source.sql:ro
    networks:
      - olake-network

  s3proxy:
    image: andrewgaul/s3proxy:latest
    container_name: s3proxy
    environment:
      S3PROXY_AUTHORIZATION: aws-v2-or-v4
      S3PROXY_IDENTITY: admin
      S3PROXY_CREDENTIAL: password123
      S3PROXY_ENDPOINT: http://0.0.0.0:9000
    ports:
      - "9000:9000"
    networks:
      - olake-network

  s3proxy-provision:
    image: amazon/aws-cli:latest
    container_name: s3proxy-provision
    depends_on:
      - s3proxy
    networks:
      - olake-network
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password123
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      sh -c "until aws --endpoint-url=http://s3proxy:9000 s3 ls > /dev/null 2>&1; do sleep 1; done;
             aws --endpoint-url=http://s3proxy:9000 s3 mb s3://warehouse || true;
             echo 'Warehouse bucket ready!'"

  iceberg-rest-catalog:
    image: tabulario/iceberg-rest:latest
    container_name: iceberg-rest-catalog
    ports:
      - "8181:8181"
    environment:
      - AWS_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
      - CATALOG_WAREHOUSE=s3://warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://s3proxy:9000
      - CATALOG_S3_PATH__STYLE__ACCESS=true
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password123
    depends_on:
      s3proxy:
        condition: service_started
      s3proxy-provision:
        condition: service_completed_successfully
    networks:
      - olake-network
